services:
  api:
    build:
      context: ./services/api
    environment:
      APP_NAME: ${APP_NAME:-SRE Incident Copilot}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
